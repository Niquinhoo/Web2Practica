name: Java CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-api-blank:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-blank

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '25'
          cache: maven

      - name: Run api-blank tests
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode verify
